name: Release signed Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require signing credentials
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw "Windows signing secrets are required for a release"
          }
      - run: npm ci
      - run: npm run verify
      - run: npm run audit:prod
      - run: npm run licenses:check
      - run: npm run desktop:dist:win
      - name: Verify installer signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath dist-desktop -Filter 'Zenme-*-windows-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid installer signature: $($signature.Status)" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist-desktop/Zenme-*-windows-x64.exe
          if-no-files-found: error

  publish-draft:
    needs: windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --draft --generate-notes --title "Zenme ${GITHUB_REF_NAME}"
