name: Verify macOS Intel package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-macos-intel:
    name: macOS 15 Intel (x64)
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Build unpacked app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:pack:mac:intel

      - name: Smoke test packaged app
        run: npm run desktop:smoke

      - name: Package macOS Intel artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:dist:mac:intel

      - name: Upload unsigned test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenme-macos-intel-unsigned
          path: |
            dist-desktop/Zenme-*-mac-x64.dmg
            dist-desktop/Zenme-*-mac-x64.zip
          if-no-files-found: error
          retention-days: 7
